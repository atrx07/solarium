name: One-time obsolete branch cleanup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-obsolete-branches.yml
permissions:
  contents: write
  pull-requests: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH_MANIFEST: |
          copilot/automatic-merge-prs 73526e344dcf76a2702dc5d7d7ffa00491adc688
          docs/room-atlas 77c4de9b4b3d137e98b144e12354f6099b751e97
          feature/007-field ef6885c340aa06b18658247e37acb398d5649a04
          fix/keyboard-canvas-parity 5856c09b5960818d03fd339235a4cac1217a14f7
          fix/mobile-lifecycle b7b7a8c44abc573d5415e938f42ae25ef07f8570
          fix/pointer-capture-release dc5d6bb1a1fb9e25dc303f9d5092b5eaa9cefab2
          fix/reduced-motion-canvas ed9364918d654367f99e754ff4d8753250964fa4
          solarium/genesis 96d09bfdf7ca3183733e5b171a50fe8a82b1d285
          solarium/modular-migration b6a9acc253ea4f59c662e3167e54c83432e83539
          solarium/murmuration 882253477cbf3bccec2a26dd1b2581982fe7e8c6
          solarium/mycelium 59386dd7a95517503e56299a14b0930486fdcd38
          solarium/prism 3b5ce38237467e1c8fc3ec4bc8b94e910919294a
          solarium/project-memory eccb345603eabb55b9790681658fc0d9e3a65c32
          solarium/reaction cee883e28a906ab2a4c40982e66b1a208d287e2f
          solarium/tides 23b4f8b164b2e1ef32f928634ccaf9c7ea9277b0
    steps:
      - name: Remove only audited obsolete refs
        shell: bash
        run: |
          set -euo pipefail
          while read -r branch expected_sha; do
            [[ -z "${branch:-}" ]] && continue
            if [[ "$branch" == "main" || "$branch" == probe/* ]]; then
              echo "::warning::Protected branch skipped: $branch"
              continue
            fi
            actual_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/${branch}" --jq '.commit.sha' 2>/dev/null)" || {
              echo "::warning::Branch absent or unreadable; skipped $branch"
              continue
            }
            if [[ "$actual_sha" != "$expected_sha" ]]; then
              echo "::warning::Branch changed since audit; skipped $branch"
              continue
            fi
            open_prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$branch" --json number --jq 'length')"
            if [[ "$open_prs" != "0" ]]; then
              echo "::warning::Open PR exists; skipped $branch"
              continue
            fi
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null
            echo "::notice::Deleted obsolete branch $branch"
          done <<< "$BRANCH_MANIFEST"
