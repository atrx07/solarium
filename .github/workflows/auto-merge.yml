name: Solarium Trusted PR Merge

# Runs the privileged integration logic from main, only after Solarium CI.
# Never checks out or executes the pull request inside this privileged job.
on:
  workflow_run:
    workflows: [Solarium]
    types: [completed]

permissions: {}

concurrency:
  group: solarium-trusted-pr-merge
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Verify the exact validated PR and merge
        shell: bash
        run: |
          set -euo pipefail

          # Experimental probe branches are never development PRs.
          if [[ "$HEAD_BRANCH" == probe/* ]]; then
            echo '::notice::Probe branch excluded from auto-merge.'
            exit 0
          fi

          # Resolve open PRs by source branch: workflow_run.pull_requests may be empty.
          pr_json="$(gh api --method GET "repos/${REPO}/pulls" \
            -f state=open -f base=main -f "head=${OWNER}:${HEAD_BRANCH}")"
          count="$(jq 'length' <<< "$pr_json")"
          if [[ "$count" != 1 ]]; then
            echo "::notice::Expected one open internal PR for ${HEAD_BRANCH}; found ${count}. Skipping."
            exit 0
          fi

          number="$(jq -r '.[0].number' <<< "$pr_json")"
          current_sha="$(jq -r '.[0].head.sha' <<< "$pr_json")"
          head_repo="$(jq -r '.[0].head.repo.full_name' <<< "$pr_json")"
          base_branch="$(jq -r '.[0].base.ref' <<< "$pr_json")"
          draft="$(jq -r '.[0].draft' <<< "$pr_json")"

          if [[ "$head_repo" != "$REPO" || "$base_branch" != main || "$draft" != false ]]; then
            echo "::notice::PR #${number} is external, draft, or targets another branch; skipping."
            exit 0
          fi
          if [[ "$current_sha" != "$HEAD_SHA" ]]; then
            echo "::notice::PR #${number} changed after CI began. Waiting for its newer CI run."
            exit 0
          fi

          # Workflow/automation changes must be integrated deliberately, not self-approved.
          changed_files="$(gh api --paginate "repos/${REPO}/pulls/${number}/files?per_page=100" --jq '.[].filename')"
          if grep -Eq '^\.github/(workflows/|CODEOWNERS$)' <<< "$changed_files"; then
            echo "::notice::PR #${number} changes workflow policy; human review required."
            exit 0
          fi

          echo "Merging trusted PR #${number} at tested head ${HEAD_SHA}."
          gh pr merge "$number" --repo "$REPO" --squash --match-head-commit "$HEAD_SHA" --delete-branch
          merged_at="$(gh api "repos/${REPO}/pulls/${number}" --jq '.merged_at')"
          if [[ "$merged_at" == null || -z "$merged_at" ]]; then
            echo "::error::PR #${number} was not confirmed merged; deployment not dispatched."
            exit 1
          fi

          # GitHub-token merges do not fire push workflows: dispatch Pages explicitly.
          gh workflow run deploy.yml --repo "$REPO" --ref main
          echo "::notice::PR #${number} merged; Solarium Pages workflow dispatched."
